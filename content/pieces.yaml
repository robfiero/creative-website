  - title: "Hunt Memorial Building Seasonal Set"
    slug: "nashua-nh-hunt-memorial-building__seasonal-set"
    description: "Four reinterpretations of the Hunt Memorial Building in Nashua, New Hampshire, with a seasonal flair. The Holiday Stroll in Nashua generally ends at the lovely tree next to Railroad Square for the tree lighting ceremony, and I thought it would be fun to reimagine the scene for various holidays, one for each season. The Christmas version emphasizes the festive holiday spirit, the Easter Day version gives it a romantic and whimsical feel, the Halloween version adds a spooky and playful atmosphere, and the Spring version focuses on the blooming flowers and fresh energy of the season."
    primaryImage: "nashua-nh-hunt-memorial-building__seasonal-easter.png"
    original:
      image: "nashua-nh-hunt-memorial-building__seasonal-set__original.jpg"
      description: "The tree in the foreground has been used for years (at least most years) to serve as a gathering place for the tree lighting at the Holiday Stroll, which traditionally takes place the Saturday night after Thanksgiving.  The actual location is very urban, but if you angle the tree just right, you can imagine the scene more natural and outside of the hustle and bustle of the city.  Since I'm familiar with the tree and it being decorated with lights for the winter holidays, I thought this would be a great first attempt to envision holidays around the calendar based on the tree with the stately Hunt Building in the background."
    tags:
      - "nashua"
      - "new-hampshire"
      - "seasonal"
    variants:
      - label: "Easter Day"
        image: "nashua-nh-hunt-memorial-building__seasonal-easter.png"
        tags:
          - "seasonal"
      - label: "July 4th"
        image: "nashua-nh-hunt-memorial-building__seasonal-july-4th.png"
        tags:
          - "seasonal"
      - label: "Halloween"
        image: "nashua-nh-hunt-memorial-building__seasonal-halloween.png"
        tags:
          - "seasonal"
      - label: "Christmas"
