  - title: "Notchview Scenic Hut"
    slug: "windsor-ma-notchview-scenic-hut"
    description: "A set of reinterpretations of the lovely scenic view at the Notchview Nordic ski area in Windsor, Massachusetts. Starting in 2015, the Berkshire Ultra Running Community for Service (BURCS) has hosted a race at the site, and the view is always iconic, changing throughout the day and into the night. The watercolor version displays a dreamy and ethereal quality, the charcoal version focuses on the lines and textures in the scene, and the neo-expressionist version turns the scene into a more exotic study of color, light, and atmosphere."
    primaryImage: "windsor-ma-notchview-hut__watercolor.png"
    tags:
      - "windsor"
      - "massachusetts"
