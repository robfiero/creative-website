pieces:
  - title: "Hollis Library"
    slug: "hollis-nh-library"
    description: "A reinterpretation of the Hollis Social Library in Hollis, NH, with a focus on atmosphere and architectural character. I remember checking books out by the armful during the summer growing up, and I always enjoyed the display of birds in the main room of the pre-renovated building. I have many fond memories of my mom bringing us to the library. The watercolor version softens the edges and emphasizes light, while the charcoal, bold-line, and black-and-white treatments shift attention toward symmetry, texture, and the building’s classical details."
    primaryImage: "hollis-nh-library__watercolor.png"
    tags:
      - "hollis"
      - "new-hampshire"
      - "architecture"
      - "library"
    variants:
