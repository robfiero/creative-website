  - title: "Peddler’s Daughter"
    slug: "nashua-nh-peddlers-daughter"
    description: "A set of stylized reinterpretations of Peddler’s Daughter in downtown Nashua. The black-and-white version emphasizes line and storefront detail, the city-poster version gives it a graphic urban energy, and the contemporary impressionist version turns the scene into a warmer study of color, light, and evening atmosphere."
