  - title: "Holman Stadium Arch Doorway"
    slug: "nashua-nh-holman-arch-doorway"
    description: "A classic view of Holman Stadium’s arched entry, treated with a clean, timeless feel. Holman Stadium is part of Nashua’s WPA-era civic history, and the image emphasizes brick, symmetry, and the kind of public architecture built to feel durable and communal."
    primaryImage: "nashua-nh-holman-arch-doorway__classic.png"
    tags:
