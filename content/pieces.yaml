pieces:
  - title: "Hollis Library"
    slug: "hollis-nh-library"
    description: "A reinterpretation of the Hollis Social Library in Hollis, NH, with a focus on atmosphere and architectural character. I remember checking books out by the armful during the summer growing up, and I always enjoyed the display of birds in the main room of the pre-renovated building. I have many fond memories of my mom bringing us to the library. The watercolor version softens the edges and emphasizes light, while the charcoal, bold-line, and black-and-white treatments shift attention toward symmetry, texture, and the building’s classical details."
    primaryImage: "hollis-nh-library__watercolor.png"
    original:
      image: "hollis-nh-library__original.jpg"
      description: "This is the photo I took of the Hollis Social Library, which I used as the source reference.  I wanted to blend the library I knew as a child with the renovated library.  You'll notice I focused on the building, and also chose to remove the right entrance.  While that entrance provided essentail access for those with disabilities, I enjoyed the symmetry of the building and wanted to emphasize that in my reinterpretation.  I also chose to remove the telephone pole, wires, and H-stake signs in addition to adding more trees to frame the building.  I wanted to create a more timeless and nostalgic feel, while also emphasizing the classical architecture of the building."
    tags:
      - "hollis"
      - "new-hampshire"
      - "architecture"
      - "library"
    variants:
      - label: "Watercolor"
        image: "hollis-nh-library__watercolor.png"
        tags:
