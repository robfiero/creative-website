  - title: "Rockport Fishing Shack"
    slug: "rockport-ma-fishing-shack"
    description: "A set of reinterpretations of the famous Rockport Fishing Shack in Rockport, Massachusetts. The watercolor version displays a dreamy and ethereal quality, the city-poster version gives it graphic illustration energy, and the contemporary impressionist version turns the scene into a warmer study of color, light, and evening atmosphere."
    primaryImage: "rockport-ma-fishing-shack__watercolor.png"
    original:
      image: "rockport-ma-fishing-shack__original.jpg"
      description: "This has to be one of the most photographed buildings in New England, if not the East Coast, so of course I had to take a photo of it myself.  The actual location has a number of buildings nearby, but I tried to envision it in a more peaceful way, maybe as a beautiful shack along a quieter stretch of beach.  I added some street lights for interest in the darker photos and made sure the moored boats that are visible from certain angles are visible to the right of the building.  I didn't notice at the time, but there is a seagull perched on the chimney and in a way that I wouldn't be lucky enough to capture again."
    tags:
