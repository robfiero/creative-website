  - title: "Holman Stadium Arch Doorway"
    slug: "nashua-nh-holman-arch-doorway"
    description: "This is a view through one of Holman Stadium’s arched entryways, based on a photo I took at sunrise one morning. Holman Stadium is part of Nashua’s Great Depression-era civic history, financed by Charles Frank Holman and the Works Progress Administration. The stadium has a vaunted history, including being home to the Brooklyn Dodgers' minor league affiliate, the first racially integrated professional baseball team in the U.S. in 1946, welcoming Roy Campanella and Don Newcombe to the team. It was also the location of the first game in which an African American, Campanella, managed a professional team with white athletes, and today it is home to the Nashua Silver Knights. The image emphasizes brick, symmetry, and the kind of public architecture built to feel durable and communal, while the view captures the morning light filtering through the arch over a classic baseball field."
    primaryImage: "nashua-nh-holman-arch-doorway__classic.png"
    tags:
      - "nashua"
      - "new-hampshire"
      - "architecture"
      - "stadium"
      - "landmark"
      - "local-history"
    variants:
      - label: "Classic"
        image: "nashua-nh-holman-arch-doorway__classic.png"
        tags:
          - "classic"

  - title: "Main Street Bridge"
    slug: "nashua-nh-main-street-bridge"
    description: "A black-and-white reinterpretation of Nashua’s Main Street bridge, using strong contrast and simplified linework to highlight structure, movement, and urban character. The monochrome style gives the scene a documentary feel while keeping the focus on shape and atmosphere."
    primaryImage: "nashua-nh-main-street-bridge__black-and-white.png"
