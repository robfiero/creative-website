  - title: "Hollis Monument Store"
    slug: "hollis-nh-monument-store"
    description: "A quiet storefront located adjacent to the Hollis Town Common, reimagined through painterly and sketch-based treatments. Growing up, I would ride my bike to the old convenience store to buy penny candy and junk food, and sometimes my friends and I would sneak over after Boy Scouts. The watercolor version gives the scene a softened, nostalgic feel, while the charcoal and expressive versions emphasize texture, age, and the handmade character of a local landmark."
    primaryImage: "hollis-nh-monument-store__watercolor.png"
    tags:
      - "hollis"
