pieces:
  - title: "Hollis Library"
    slug: "hollis-nh-library"
    description: "A reinterpretation of the Hollis Social Library with a focus on atmosphere and architectural character. The watercolor version softens the edges and emphasizes light, while the charcoal, bold-line, and black-and-white treatments shift attention toward symmetry, texture, and the building’s classical details."
