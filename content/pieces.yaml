  - title: "Hollis Monument Store"
    slug: "hollis-nh-monument-store"
    description: "A quiet small-town storefront reimagined through painterly and sketch-based treatments. The watercolor version gives the scene a softened, nostalgic feel, while the charcoal and expressive versions emphasize texture, age, and the handmade character of a local landmark."
