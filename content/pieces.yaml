  - title: "Hunt Memorial Building"
    slug: "nashua-nh-hunt-memorial-building"
    description: "The Hunt Memorial Building in Nashua, New Hampshire, is an often overlooked gem. It’s a beautiful piece of architecture and a local landmark right at the top of Library Hill, and in looking at it, I envisioned the building in a few different ways. First, what it could look like with a bit more grass and landscaping, with color bursting in spring. Or, without color, using a black-and-white charcoal image to bring forward the beautiful lines and architecture of the building. Lastly, for fun, a postcard that someone could have sent in the 1920s, 1940s, or even the 1960s, with a nostalgic, vintage feel."
    primaryImage: "nashua-nh-hunt-memorial-building__realistic.png"
    original:
      image: "nashua-nh-hunt-memorial-building__original.jpg"
      description: "There are some wonderful buildings in Nashua, but the Hunt Memorial Building has to be one of the top ones, and yet challenging to appreciate.  The location at the top of Library Hill isn't the most accessible, and the building is often overlooked despite the beautiful architecture.  It doesn't help that the First Church is right across the street and is stunning in its own right.  When I envisioned the Hunt Building, I looked at it with a bit more landscaping and greenery, as well as a bit of lawn that may have been there when the road wasn't quite as wide.  I moved the tree that is decorated for the holidays closer to frame the building, and hid the cars, clutter, wires and other buildings so that the focus could be on the Hunt Building itself."
    tags:
      - "nashua"
      - "new-hampshire"
      - "architecture"
      - "landmark"
      - "downtown"
    variants:
      - label: "Classic Realistic"
        image: "nashua-nh-hunt-memorial-building__realistic.png"
        tags:
          - "architecture"
      - label: "Charcoal & Sketch"
        image: "nashua-nh-hunt-memorial-building__black-white.png"
        tags:
          - "charcoal"
      - label: "Postcard"
        image: "nashua-nh-hunt-memorial-building__postcard.png"
        tags:
          - "postcard"

