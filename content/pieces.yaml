  - title: "Hollis Monument Store"
    slug: "hollis-nh-monument-store"
    description: "The market is a quiet storefront adjacent to the Hollis Town Common, reimagined through painterly and sketch-based treatments. Growing up, I would ride my bike to the old convenience store to buy penny candy, and sometimes my friends and I would sneak over after Boy Scout meetings. The watercolor version gives the scene a softened, nostalgic feel, while the charcoal and expressive versions emphasize texture, age, and the handmade character of a local landmark."
    primaryImage: "hollis-nh-monument-store__watercolor.png"
    original:
      image: "hollis-nh-monument-store__original.jpg"
      description: "This original is the photo I took.  I wanted to focus on the timeless feel of the building, the outside of which hasn't changed significantly since I would go in the 1970s.  I did remove the cars, the stop sign, and the help wanted signs which were distracting from the building and the overall composition.  I changed the Open flag to a US flag, added more trees to frame the building, and added some fading to the edges, as if the other buildings nearby are fading into history."
    tags:
      - "hollis"
      - "new-hampshire"
      - "architecture"
      - "storefront"
      - "landmark"
    variants:
      - label: "Watercolor"
        image: "hollis-nh-monument-store__watercolor.png"
        tags:
          - "watercolor"
      - label: "Charcoal"
        image: "hollis-nh-monument-store__charcoal.png"
        tags:
          - "charcoal"
      - label: "Expressive"
        image: "hollis-nh-monument-store__expressive.png"
        tags:
          - "expressive"

  - title: "Leda Lanes"
    slug: "nashua-nh-leda-lanes"
    description: "A poster-style tribute to a longtime Nashua bowling landmark. Leda Lanes opened in 1959 and became a familiar gathering place for generations of bowlers and families. If you are from Nashua, you may remember going there as a child, or maybe you were a member of a league. This image leans into bold color, simplified shapes, and retro destination-poster energy, presenting the bowling alley as a cheerful local landmark and a nostalgic destination for fun nights out. The poster style gives the iconic sign and building a vintage feel while celebrating the unique character of this beloved spot."
    primaryImage: "nashua-nh-leda-lanes__poster-style.png"
    original:
      image: "nashua-nh-leda-lanes__original.jpg"
      description: "I took this photo after Leda Lanes had closed but just before it was demolished.  I was very sad while taking the photo, as another landmark from the \"old\" Nashua was being lost.  I wanted to create a reinterpretation that would celebrate the building and the sign, and also give it a nostalgic feel.  Sitting in the parking lot, I wondered what it would have felt like to be right there in the late 1950s.  The sign in the piece is new and the building is in brand new condition, welcoming friends to their evening league night or maybe a drink in the pub.  This building and business was a community staple for decades, and I hope to have celebrated that in this reinterpretation."
    tags:
      - "nashua"
      - "new-hampshire"
      - "landmark"
      - "nostalgic"
      - "local-history"
    variants:
      - label: "Poster Style"
        image: "nashua-nh-leda-lanes__poster-style.png"
        tags:
          - "poster-style"

  - title: "Whiting Building"
    slug: "nashua-nh-whiting-building"
    description: "The historic Whiting Building in downtown Nashua was built in 1889. It has always stood out to me because the cream-colored brick used in its construction is different from the red brick of the surrounding buildings. I've reimagined the building in the format of an 1890s streetscape, wondering how it might have looked when it was brand new, with the church behind it. The treatment uses softened period atmosphere, warm architectural detail, and a restrained historic palette to suggest the city’s transition from village center to busy downtown."
    primaryImage: "nashua-nh-whiting-building__historic-1890s.png"
    original:
      image: "nashua-nh-whiting-building__original.jpg"
      description: "This view is from across the street at Railroad Square and what is currently the Riverwalk Cafe.  Back in the day I would have been standing in the middle of the street.  The church has been in that spot even longer than the Whiting Building, and I thought the two paired made a more impressive scene.  I can only imagine how the two would have looked, imposing buildings in a growing downtown that was made up of houses as well as grander buildings.  I removed all the stoplights, wires, and other visual distractions to focus on the two great buildings between the river and Library Hill.  I don't believe the church had its spire in the 1890s, but I kept it as a small historial inaccuracy to keep the church more recognizable."
    tags:
      - "nashua"
      - "new-hampshire"
      - "architecture"
      - "downtown"
      - "historic"
      - "local-history"
    variants:
      - label: "Historic 1890s"
        image: "nashua-nh-whiting-building__historic-1890s.png"
        tags:
          - "historic"

  - title: "Hayward’s"
    slug: "nashua-nh-haywards"
    description: "A nostalgic reinterpretation of Hayward’s Ice Cream in Nashua, NH. Since opening in 1940, generations of families have enjoyed this classic ice cream stand. The postcard version presents Hayward’s as a cheerful roadside destination, while the whimsy-cars variation adds playful vintage energy and a sense of summer memory, where generations of cars have gathered to enjoy an ice cream cone together."
    primaryImage: "nashua-nh-haywards__postcard.png"
    original:
      image: "nashua-nh-haywards__original.jpg"
      description: "Which ice cream stand is your favorite?  Well, I have opinions there and have to admit I have a bias for a few in Hollis.  That said, I love Hayward's and join generations of people who have come to enjoy an ice cream cone together.  That is the theme of both of the images I created - postcards from the past, and a whimsical look at generations coming together to enjoy a treat, as symbolized by various decades of car models."
    tags:
      - "nashua"
      - "new-hampshire"
      - "landmark"
      - "nostalgic"
    variants:
      - label: "Postcard"
        image: "nashua-nh-haywards__postcard.png"
        tags:
          - "postcard"
      - label: "Whimsy Cars"
        image: "nashua-nh-haywards__whimsy-cars.png"
        tags:
          - "whimsy"

  - title: "Holman Stadium Arch Doorway"
    slug: "nashua-nh-holman-arch-doorway"
    description: "This is a view through one of Holman Stadium’s arched entryways, based on a photo I took at sunrise one morning. Holman Stadium is part of Nashua’s Great Depression-era civic history, financed by Charles Frank Holman and the Works Progress Administration. The stadium has a vaunted history, including being home to the Brooklyn Dodgers' minor league affiliate, the first racially integrated professional baseball team in the U.S. in 1946, welcoming Roy Campanella and Don Newcombe to the team. It was also the location of the first game in which an African American, Campanella, managed a professional team with white athletes, and today it is home to the Nashua Silver Knights. The image emphasizes brick, symmetry, and the kind of public architecture built to feel durable and communal, while the view captures the morning light filtering through the arch over a classic baseball field."
    primaryImage: "nashua-nh-holman-arch-doorway__classic.png"
    original:
      image: "nashua-nh-holman-arch-doorway__original.jpg"
      description: "I met friends to run from Holman Stadium and made them wait for me as I took this photo.  Holman is legendary for many reasons, and while this doesn't capture the stadium as a whole, I think it captures the experience of entering the stadium to enjoy a game.  I envisioned the scene nostalgically, where this could be Holman in 1946 or it could be last week.  The lighting could be dawn or dusk, and the First Church spire is closer than it is in life and very visible in the background.  I did take the liberty of capturing stores from different eras advertising along the outfield wall, including Millyard Bank, as a nod to a high school friend who loves baseball and was a ball boy for the team."
    tags:
      - "nashua"
      - "new-hampshire"
      - "architecture"
      - "stadium"
      - "landmark"
      - "local-history"
    variants:
      - label: "Classic"
        image: "nashua-nh-holman-arch-doorway__classic.png"
        tags:
          - "classic"

  - title: "Main Street Bridge"
    slug: "nashua-nh-main-street-bridge"
    description: "A black-and-white reinterpretation of Nashua’s Main Street bridge, using strong contrast and simplified linework to highlight structure, movement, and urban character. The monochrome style gives the scene a documentary feel while keeping the focus on shape and atmosphere."
    primaryImage: "nashua-nh-main-street-bridge__black-and-white.png"
    original:
      image: "nashua-nh-main-street-bridge__original.jpg"
      description: "I took this photo on St. Patrick's Day morning 2026 while waiting in line for the Peddler's Daughter to open.  I hadn't taken it with any plan other than being bored while waiting, but when I started making AI enhanced images and reinterpretations, I found that the lines in both the bridge and the old mill building in the background are very strong and lend themselves to a black-and-white treatment.  I emphasized this by removing the cars, most of the lines on the road, the paper boxes and the people.  This way the bridge, buildings and the beautiful street lights across the bridge stand out."
    tags:
      - "nashua"
      - "new-hampshire"
      - "architecture"
      - "bridge"
      - "downtown"
    variants:
      - label: "Black & White"
        image: "nashua-nh-main-street-bridge__black-and-white.png"
        tags:
          - "black-and-white"

  - title: "Peddler’s Daughter"
    slug: "nashua-nh-peddlers-daughter"
    description: "A set of stylized reinterpretations of Peddler’s Daughter in downtown Nashua, NH. If you haven't been there, this is the real deal for fish and chips, along with a great pint of Guinness. The black-and-white version emphasizes line and storefront detail, the city-poster version gives it graphic urban energy, and the contemporary impressionist version turns the scene into a warmer study of color, light, and evening atmosphere."
    primaryImage: "nashua-nh-peddlers-daughter__black-and-white.png"
    original:
      image: "nashua-nh-peddlers-daughter__original.jpg"
      description: "This is another photo I took on St. Patrick's Day morning 2026 while waiting in line for the Peddlers Daughter to open.  I remember when Goodale’s Bike Shop used to be in this building, and the extensive renovations around 2003 before Peddler's opened.  This is one of the oldest pubs along Main Street, and always has a welcoming and festive feel.  I wanted to envision the pub in several different formats, taking advantage of the beautiful edifice and the festive bunting.  I think my favorite view is the Contemporary Impressionism - what's your favorite?"
    tags:
      - "nashua"
      - "new-hampshire"
      - "architecture"
      - "restaurant"
