  - title: "Leda Lanes"
    slug: "nashua-nh-leda-lanes"
    description: "A poster-style tribute to a longtime Nashua bowling landmark. Leda Lanes opened in 1969 and became a familiar gathering place for generations of bowlers and families; this version leans into bold color, simplified shapes, and retro destination-poster energy."
    primaryImage: "nashua-nh-leda-lanes__poster-style.png"
    tags:
      - "nashua"
      - "new-hampshire"
      - "landmark"
      - "nostalgic"
      - "local-history"
    variants:
      - label: "Poster Style"
        image: "nashua-nh-leda-lanes__poster-style.png"
        tags:
          - "poster-style"

  - title: "Whiting Building"
    slug: "nashua-nh-whiting-building"
    description: "A historic downtown Nashua building reimagined with the mood of an 1890s streetscape. The treatment uses softened period atmosphere, warm architectural detail, and a restrained historic palette to suggest the city’s transition from village center to busy downtown."
    primaryImage: "nashua-nh-whiting-building__historic-1890s.png"
    tags:
